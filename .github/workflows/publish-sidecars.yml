name: Publish Aria2 Sidecars

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils unzip

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare Linux aria2c sidecar from fallback strategy
        env:
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
          MOTRIX_SIDECAR_REGENERATE: "1"
          MOTRIX_SIDECAR_USE_DOCKER: "1"
        run: node scripts/prepare-sidecar.mjs

      - name: Verify Linux aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: node scripts/check-sidecar.mjs

      - name: Upload Linux sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-sidecar
          path: src-tauri/binaries/motrix-aria2c-x86_64-unknown-linux-gnu

  build-macos:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install source build dependencies
        run: |
          brew install autoconf automake libtool pkg-config cppunit gettext

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare macOS aria2c sidecar from fallback strategy
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          MOTRIX_SIDECAR_REGENERATE: "1"
        run: node scripts/prepare-sidecar.mjs

      - name: Verify macOS aria2c sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/check-sidecar.mjs

      - name: Upload macOS sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-sidecar
          path: src-tauri/binaries/motrix-aria2c-${{ matrix.target }}

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-gnu
          - x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Prepare Windows aria2c sidecar from fallback strategy
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          MOTRIX_SIDECAR_REGENERATE: "1"
        run: node scripts/prepare-sidecar.mjs

      - name: Verify Windows aria2c sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/check-sidecar.mjs

      - name: Upload Windows sidecar artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}-sidecar
          path: src-tauri/binaries/motrix-aria2c-${{ matrix.target }}.exe

  publish:
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download sidecar artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute sidecar release metadata
        id: meta
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('sidecar-manifest.json', 'utf8')).aria2Version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=aria2-sidecar-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create sidecar release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1 || \
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Aria2 sidecars ${{ steps.meta.outputs.version }}" \
            --notes "Repository-managed prebuilt aria2 sidecar binaries for Motrix."

      - name: Upload sidecar release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.meta.outputs.tag }}" release-assets/* --clobber

      - name: Sync sidecar checksums back into manifest
        run: node scripts/sync-sidecar-release-sha.mjs release-assets/SHA256SUMS.txt

      - name: Upload updated manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: updated-sidecar-manifest
          path: sidecar-manifest.json
