name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            binutils \
            unzip

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache aria2 sidecar downloads
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ hashFiles('sidecar-manifest.json') }}-linux-x86_64-unknown-linux-gnu
          restore-keys: |
            aria2-${{ hashFiles('sidecar-manifest.json') }}-linux-

      - name: Prepare aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: node scripts/prepare-sidecar.mjs

      - name: Verify aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: node scripts/check-sidecar.mjs

      - name: Run Node-based tests
        run: node --test tests/*.test.mjs

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri

      - name: Setup Windows Rust target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Install mingw-w64 (Windows cross-linker)
        run: sudo apt-get install -y mingw-w64

      - name: Cache Windows aria2 sidecar
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ hashFiles('sidecar-manifest.json') }}-windows-x86_64-pc-windows-gnu
          restore-keys: |
            aria2-${{ hashFiles('sidecar-manifest.json') }}-windows-

      - name: Prepare Windows aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-pc-windows-gnu
        run: node scripts/prepare-sidecar.mjs

      - name: Verify Windows aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-pc-windows-gnu
        run: node scripts/check-sidecar.mjs

      - name: Check Rust compilation for Windows
        run: cargo check --target x86_64-pc-windows-gnu
        working-directory: src-tauri
