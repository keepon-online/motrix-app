name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

env:
  ARIA2_VERSION: "1.37.0"

jobs:
  verify:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            libssl-dev \
            libxml2-dev \
            libcppunit-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libc-ares-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache aria2 sidecar build
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ env.ARIA2_VERSION }}-linux-x86_64-unknown-linux-gnu
          restore-keys: |
            aria2-${{ env.ARIA2_VERSION }}-linux-

      - name: Prepare aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
          MOTRIX_ARIA2_VERSION: ${{ env.ARIA2_VERSION }}
        run: node scripts/prepare-sidecar.mjs

      - name: Verify aria2c sidecar
        run: |
          SIDECAR="src-tauri/binaries/motrix-aria2c-x86_64-unknown-linux-gnu"
          test -f "$SIDECAR" || { echo "::error::Sidecar not found: $SIDECAR"; exit 1; }
          test -s "$SIDECAR" || { echo "::error::Sidecar is empty: $SIDECAR"; exit 1; }
          chmod +x "$SIDECAR"
          "$SIDECAR" --version || { echo "::error::Sidecar failed version check"; exit 1; }

      - name: Run Node-based tests
        run: node --test tests/*.test.mjs

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test
        working-directory: src-tauri
