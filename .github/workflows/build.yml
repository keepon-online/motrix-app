name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            binutils \
            unzip

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache aria2 sidecar downloads
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ hashFiles('sidecar-manifest.json') }}-linux-${{ matrix.target }}
          restore-keys: |
            aria2-${{ hashFiles('sidecar-manifest.json') }}-linux-

      - name: Prepare aria2c sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/prepare-sidecar.mjs

      - name: Verify aria2c sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/check-sidecar.mjs

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Motrix ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  build-macos:
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-13
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          brew install gettext

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache aria2 sidecar downloads
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ hashFiles('sidecar-manifest.json') }}-macos-${{ matrix.target }}
          restore-keys: |
            aria2-${{ hashFiles('sidecar-manifest.json') }}-macos-

      - name: Prepare aria2c sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/prepare-sidecar.mjs

      - name: Verify aria2c sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/check-sidecar.mjs

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Motrix ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache aria2 sidecar downloads
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ hashFiles('sidecar-manifest.json') }}-windows-x86_64-pc-windows-msvc
          restore-keys: |
            aria2-${{ hashFiles('sidecar-manifest.json') }}-windows-

      - name: Prepare aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/prepare-sidecar.mjs

      - name: Verify aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-pc-windows-msvc
        run: node scripts/check-sidecar.mjs

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Motrix ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
