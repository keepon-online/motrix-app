name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  ARIA2_VERSION: "1.37.0"

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            libssl-dev \
            libxml2-dev \
            libcppunit-dev \
            zlib1g-dev \
            libsqlite3-dev \
            libssh2-1-dev \
            libc-ares-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache aria2 sidecar build
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ env.ARIA2_VERSION }}-linux-${{ matrix.target }}
          restore-keys: |
            aria2-${{ env.ARIA2_VERSION }}-linux-

      - name: Prepare aria2c sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          MOTRIX_ARIA2_VERSION: ${{ env.ARIA2_VERSION }}
        run: node scripts/prepare-sidecar.mjs

      - name: Verify aria2c sidecar
        run: |
          SIDECAR="src-tauri/binaries/motrix-aria2c-${{ matrix.target }}"
          test -f "$SIDECAR" || { echo "::error::Sidecar not found: $SIDECAR"; exit 1; }
          test -s "$SIDECAR" || { echo "::error::Sidecar is empty: $SIDECAR"; exit 1; }
          chmod +x "$SIDECAR"
          "$SIDECAR" --version || { echo "::error::Sidecar failed version check"; exit 1; }
          echo "Sidecar verified: $(ls -lh "$SIDECAR")"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Motrix ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  build-macos:
    strategy:
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-latest
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-13
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config cppunit gettext

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache aria2 sidecar build
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ env.ARIA2_VERSION }}-macos-${{ matrix.target }}
          restore-keys: |
            aria2-${{ env.ARIA2_VERSION }}-macos-

      - name: Prepare aria2c sidecar
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
          MOTRIX_ARIA2_VERSION: ${{ env.ARIA2_VERSION }}
        run: node scripts/prepare-sidecar.mjs

      - name: Verify aria2c sidecar
        run: |
          SIDECAR="src-tauri/binaries/motrix-aria2c-${{ matrix.target }}"
          test -f "$SIDECAR" || { echo "::error::Sidecar not found: $SIDECAR"; exit 1; }
          test -s "$SIDECAR" || { echo "::error::Sidecar is empty: $SIDECAR"; exit 1; }
          chmod +x "$SIDECAR"
          "$SIDECAR" --version || { echo "::error::Sidecar failed version check"; exit 1; }
          echo "Sidecar verified: $(ls -lh "$SIDECAR")"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Motrix ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache aria2 sidecar download
        uses: actions/cache@v5
        with:
          path: .sidecar-cache
          key: aria2-${{ env.ARIA2_VERSION }}-windows-x86_64-pc-windows-msvc
          restore-keys: |
            aria2-${{ env.ARIA2_VERSION }}-windows-

      - name: Prepare aria2c sidecar
        env:
          TARGET_TRIPLE: x86_64-pc-windows-msvc
          MOTRIX_ARIA2_VERSION: ${{ env.ARIA2_VERSION }}
        run: node scripts/prepare-sidecar.mjs

      - name: Verify aria2c sidecar
        shell: pwsh
        run: |
          $sidecar = "src-tauri/binaries/motrix-aria2c-x86_64-pc-windows-msvc.exe"
          if (-not (Test-Path $sidecar)) {
            Write-Error "Sidecar not found: $sidecar"
            exit 1
          }
          $size = (Get-Item $sidecar).Length
          if ($size -eq 0) {
            Write-Error "Sidecar is empty: $sidecar"
            exit 1
          }
          # Verify it is a valid PE executable
          $header = [System.Text.Encoding]::ASCII.GetString((Get-Content $sidecar -AsByteStream -TotalCount 2))
          if ($header -ne 'MZ') {
            Write-Error "Sidecar is not a valid PE executable (expected MZ header, got: $header)"
            exit 1
          }
          Write-Host "Sidecar verified: $sidecar ($size bytes, valid PE)"
          # Execute version check to verify binary works (no DLL missing, no launch error)
          try {
            & $sidecar --version 2>&1 | ForEach-Object { Write-Host "aria2c: $_" }
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Sidecar version check returned exit code $LASTEXITCODE"
              exit 1
            }
          } catch {
            Write-Error "Sidecar failed to execute: $_"
            exit 1
          }

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Motrix ${{ github.ref_name }}"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
